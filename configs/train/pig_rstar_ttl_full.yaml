# Original RSTAR + TTL on RTX A6000. Batch 1 with FP16 AMP.
# Match the original Stage II parent and paired data before training.
device: cuda
amp: true
model_profile: official_v1
seed: 2026
epochs: {'1': 60, '2': 30}
steps_per_epoch: {'2': 0}  # Existing default: 15 draws per training case per epoch
learning_rate: 0.00015
scheduler: poly  # nnU-Net-style polynomial decay over the configured epoch budget
loss: {kind: public_code, ssim_weight: 0.1}
normalization: {scale: 0.02, offset: 0.0}
stage2_patches: [[16, 128, 128], [32, 96, 96], [64, 64, 64]]
small_volume: error
workers: 0
accumulation: 1
temporal_roll: false

stam:
  mode: 'off'

ttl:
  mode: full
  z_chunk_size: 0  # Process all independent axial layers in one batch

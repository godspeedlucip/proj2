name: rstar4d-train
channels: [pytorch, nvidia, conda-forge]
dependencies:
  - python=3.9
  - pytorch=2.3.1
  - pytorch-cuda=11.8
  - numpy=1.26.3
  - scipy
  - h5py
  - pyyaml
  - nibabel
